# Slack app manifest for Dill.
# Paste into api.slack.com/apps → your app → App Manifest, save, then
# reinstall the app so new scopes and events take effect.

display_information:
  name: Dill
  description: Team rotations and picks
features:
  bot_user:
    display_name: Dill
    always_online: true
  slash_commands:
    - command: /dill
      description: Manage team rotations
      usage_hint: "[help | pick | reset | status | ...]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:delete
      - commands
      - users:read
      - channels:read
      - groups:read
      - channels:history
      - groups:history
      - channels:join
      # Speaking order: read ❌ reactions on the speaking-order list
      - reactions:read
settings:
  event_subscriptions:
    bot_events:
      # Speaking order: remove / restore people on the speaking-order list
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
